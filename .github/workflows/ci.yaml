name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/demo:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:${{ github.sha }}

      - name: Checkout GitOps Repo
        run: |
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/YOUR_USERNAME/cisco-gitops.git

      - name: Update Image Tag in GitOps Repo
        run: |
          cd cisco-gitops/base
          sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/demo:${{ github.sha }}|" deployment.yaml
          cd ..
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update image tag to ${{ github.sha }}"
          git push
